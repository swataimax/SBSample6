<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title th:text="登録"></title>
</head>
<body>
	<form th:action="@{/insert}" th:object="${form}" method="post">
		<table>
			<tr>
				<td>日にち</td>
				<td><input type="date" th:field="*{date}"></td>
			</tr>
			<tr>
				<td>分　類</td>
				<td>
					<select th:field="*{classification}">
						<option value="食品">食品</option>
						<option value="日用品">日用品</option>
						<option value="その他">その他</option>
					</select>
				</td>
			</tr><tr>
				<td>名　称</td>
				<td><input type="text" th:field="*{name}"></td>
			</tr><tr>
				<td>価　格</td>
				<td><input type="text" th:field="*{price}"></td>
			</tr>
		</table>
		<input type="submit">
	</form>
</body>
</html>
